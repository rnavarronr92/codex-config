# Plantilla de configuración local para Codex.
# No copies secretos ni tokens a este repositorio.
# Revisa la documentación del servidor antes de habilitarlo.

# Ejemplo de un servidor MCP local de Azure DevOps:
# [mcp_servers.azure-devops]
# command = "npx"
# args = ["-y", "@azure-devops/mcp", "TU_ORGANIZACION"]

# La configuración real normalmente se guarda en:
# ~/.codex/config.toml

# Opcional: limita la concurrencia de subagentes en clientes compatibles.
# Los roles personales se copian a $CODEX_HOME/agents mediante install.sh.
# Los modelos y el esfuerzo se heredan de la sesión; no se fijan en los roles.
# [agents]
# max_concurrent_threads_per_session = 3
